image:
  frontendRepo: ghcr.io/melendo/climbit-frontend
  backendRepo: ghcr.io/melendo/climbit-backend
  tag: "1.0.1"
  pullPolicy: IfNotPresent

config:
  port: "3000"
  jwtExpiresIn: "12h"
  postgresUser: "climbit"
  postgresDb: "climbit_db"
  pgadminEmail: "admin@climbit.local"

storage:
  postgresSize: 5Gi
  uploadsSize: 50Gi
  ssdClass: local-ssd
  hddClass: local-hdd

pgadmin:
  enabled: true