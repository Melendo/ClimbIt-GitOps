apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: climbit-ingress
  annotations:
     kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80