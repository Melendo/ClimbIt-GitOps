apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: climbit-external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: climbit-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.keys.jwtSecret | quote }}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.keys.postgresPassword | quote }}
    - secretKey: PGADMIN_DEFAULT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.keys.pgadminPassword | quote }}
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.keys.databaseUrl | quote }}